<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Account</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .signin-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .signin-card {
            background: white;
            border-radius: 8px;
            border: 1px solid #dadce0;
            max-width: 450px;
            width: 100%;
            padding: 48px 40px 36px;
        }
        
        .google-logo {
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .signin-title {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
            color: #202124;
        }
        
        .signin-subtitle {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 24px;
        }
        
        .form-control {
            border-radius: 4px;
            border: 1px solid #dadce0;
            padding: 13px 15px;
            font-size: 16px;
        }
        
        .form-control:focus {
            border-color: #1a73e8;
            box-shadow: none;
            outline: 2px solid #1a73e8;
        }
        
        .forgot-link {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .forgot-link:hover {
            text-decoration: underline;
        }
        
        .guest-mode-text {
            font-size: 14px;
            color: #5f6368;
            margin-top: 24px;
        }
        
        .btn-create {
            color: #1a73e8;
            background: transparent;
            border: none;
            font-weight: 500;
            padding: 10px 24px;
        }
        
        .btn-create:hover {
            background: #e8f0fe;
        }
        
        .btn-next {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            font-weight: 500;
            border-radius: 4px;
        }
        
        .btn-next:hover {
            background: #1765cc;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
        }
        
        .footer-links {
            margin-top: auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #5f6368;
        }
        
        .footer-links a {
            color: #5f6368;
            text-decoration: none;
            margin: 0 12px;
        }
        
        .footer-links a:hover {
            color: #202124;
        }
    </style>
</head>
<body>
    <!-- Sign In Container -->
    <div class="signin-container">
        <div class="signin-card">
            <!-- Google Logo using Bootstrap Icons -->
            <div class="google-logo mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="75" height="24" viewBox="0 0 75 24">
                    <path fill="#4285F4" d="M67.954 16.303c-1.515 0-2.694-.613-3.219-1.766l8.729-3.614-.318-.783c-.585-1.554-2.357-4.44-5.98-4.44-3.594 0-6.566 2.827-6.566 6.654 0 3.726 2.93 6.654 6.903 6.654 3.18 0 5.028-1.946 5.787-3.075l-2.369-1.576c-.788 1.155-1.872 1.946-3.416 1.946zm-.232-8.184c1.214 0 2.245.638 2.586 1.516l-6.194 2.577c0-2.767 1.918-4.093 3.608-4.093z"/>
                    <path fill="#EA4335" d="M58.193.001h3.169V18.61h-3.169z"/>
                    <path fill="#FBBC05" d="M52.846 8.934c0-1.088-.024-2.117-.072-3.003H42.83v5.686h5.61c-.24 1.302-1.01 2.402-2.15 3.14v2.646h3.477c2.036-1.875 3.208-4.635 3.208-7.922-.001-.548-.045-1.094-.129-1.547z"/>
                    <path fill="#4285F4" d="M42.83 19.224c2.907 0 5.348-.964 7.13-2.607l-3.477-2.7c-.964.645-2.196 1.025-3.653 1.025-2.806 0-5.184-1.894-6.03-4.44h-3.593v2.786c1.792 3.56 5.474 5.936 9.623 5.936z"/>
                    <path fill="#34A853" d="M36.8 10.502c-.218-.645-.341-1.336-.341-2.051s.123-1.406.34-2.05V3.613h-3.592C31.848 5.012 31.2 6.94 31.2 8.95s.648 3.938 2.008 5.337l3.592-2.785z"/>
                    <path fill="#EA4335" d="M42.83 3.064c1.583 0 3.004.544 4.12 1.611l3.09-3.09C48.173.584 45.73 0 42.83 0c-4.149 0-7.831 2.375-9.623 5.936l3.592 2.787c.846-2.546 3.224-4.44 6.03-4.44z"/>
                    <path fill="none" d="M0 0h24v24H0z"/>
                </svg>
            </div>
            
            <!-- Sign In Title -->
            <h1 class="signin-title">Sign in</h1>
            <p class="signin-subtitle">Use your Google Account</p>
            
            <!-- Sign In Form -->
            <form id="signinForm">
                <!-- Email Input -->
                <div class="mb-3">
                    <input type="email" 
                           class="form-control" 
                           id="emailInput" 
                           placeholder="Email or phone"
                           required>
                </div>
                
                <!-- Forgot Email Link -->
                <div class="mb-4">
                    <a href="#" class="forgot-link">Forgot email?</a>
                </div>
                
                <!-- Guest Mode Info -->
                <div class="guest-mode-text mb-4">
                    Not your computer? Use Guest mode to sign in privately.
                    <a href="#" class="forgot-link d-block mt-1">Learn more about using Guest mode</a>
                </div>
                
                <!-- Action Buttons -->
                <div class="d-flex justify-content-between align-items-center">
                    <a href="index.html" class="btn-create">Create account</a>
                    <button type="submit" class="btn-next">Next</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Footer Links -->
    <div class="footer-links">
        <div>
            <select class="form-select form-select-sm d-inline-block" style="width: auto; border: none; color: #5f6368;">
                <option>English (United States)</option>
            </select>
        </div>
        <div>
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Sign In Form Handler -->
    <script>
        document.getElementById('signinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            
            if (email) {
                // Simulate sign in
                alert(`Sign in functionality would continue with: ${email}\n\nThis is a demo page - no actual authentication occurs.`);
                // In a real app, this would proceed to password entry or authentication
            }
        });
    </script>
</body>
</html>
